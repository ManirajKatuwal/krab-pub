[package]
name = "service_frontend_islands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Islands for the Krab reference frontend: server-rendered by service_frontend, hydrated by this crate's WASM bundle"
# Part of the reference frontend, not framework surface. Until 0.6.0 these three
# islands shipped inside `krab_client` behind its `demo-islands` feature, which
# registered `Counter`/`Toggle`/`Likes` in every consumer's hydration registry.
publish = false

[lib]
# `cdylib` for `wasm-pack build`, `rlib` so `service_frontend` links the same
# definitions for server rendering. One source of truth for both halves.
crate-type = ["cdylib", "rlib"]

[dependencies]
krab_core = { workspace = true }
krab_macros = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Browser only. `#[island]`'s client half references `krab_client` and
# `inventory` by path, and `web` must be on for the hydration runtime.
[target.'cfg(target_arch = "wasm32")'.dependencies]
krab_core = { workspace = true, features = ["web"] }
krab_client = { workspace = true, features = ["web"] }
inventory = "0.3"
wasm-bindgen = "0.2"

[features]
default = []

# Selects the browser half of `#[island]`. ONLY valid together with
# `--target wasm32-unknown-unknown` — the client half's dependencies above are
# wasm32-only. Build the bundle `service_frontend` serves from `/pkg/` with:
#
#     wasm-pack build services/service_frontend_islands --release --target web \
#         --out-dir ../../dist/pkg -- --features web
#
# or `krab build --target client --release`, which reads the same settings from
# `krab.toml`.
web = []

# rustc 1.97 emits bulk-memory and nontrapping-fptoint by default; the binaryen
# wasm-pack bundles (version 117) rejects them unless told they exist.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
