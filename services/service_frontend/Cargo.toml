[package]
name = "service_frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SSR + islands frontend — Krab reference service"
publish = false

[features]
# Enable non-functional / performance tests.  Run via `cargo test --features nft`
# or by setting KRAB_NFT=1 in CI (see .github/workflows/nft.yaml).
nft = []

[dependencies]
axum = { workspace = true, features = ["ws"] }
hyper = { version = "1.0", features = ["full"] }
tokio = { workspace = true, features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
bytes = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
krab_core = { workspace = true, features = ["rest", "redis-store"] }
# This is the *server* half of the island story: it renders `Counter`, `Toggle`
# and `Likes` to HTML with `data-island` / `data-props` wrappers so the browser
# bundle can find and hydrate them. `#[island]` selects that half on
# `not(feature = "web")`, so the frontend must NOT get `krab_client`'s default
# `web` feature — with it, the same call emits bare component markup and there
# is nothing left for `hydrate()` to attach to.
#
# Caveat worth knowing: Cargo unifies features across a single invocation, so a
# workspace-wide `cargo build --workspace` still compiles `krab_client` with
# `web` (it is a workspace member and gets its own defaults) and this crate
# links against that build. Package-scoped builds — `cargo build --bin
# service_frontend`, which is what `Dockerfile.service` and the E2E gate run —
# honour the opt-out and emit the wrappers.
krab_client = { workspace = true, default-features = false, features = ["demo-islands"] }
krab_macros = { workspace = true }
# Real digests for the asset manifest. The manifest used to publish a
# hardcoded `sha256-demo-manifest-checksum`, which described no file.
sha2 = "0.10"
base64 = "0.22"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tower = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["trace", "cors", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-stream = { version = "0.1.18", features = ["sync"] }
futures-util = "0.3.32"
anyhow.workspace = true
async-trait.workspace = true

[dev-dependencies]
serial_test = "3"

[lints.rust]
# This service is the demonstration consumer of `krab_client`'s bundled demo
# islands, which are deprecated and removed in 0.5.0 (see
# `crates/framework/krab_client/src/components.rs`). It uses them on purpose,
# so the warning is noise here and would fail `clippy -D warnings`. Narrow this
# to an `#[allow(deprecated)]` on the import once the service defines its own
# islands — the crate-wide allow also hides unrelated deprecations.
deprecated = "allow"
