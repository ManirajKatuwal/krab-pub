[package]
name = "krab_client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/krab_client"
description = "WASM island hydration runtime for the Krab framework"
keywords = ["krab", "wasm", "hydration", "islands", "frontend"]
categories = ["wasm", "web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# The router awaits a `fetch` promise from a synchronous click handler.
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
krab_core = { workspace = true, features = ["web"] }
krab_macros = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
inventory = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "NodeList",
    "Window",
    "console",
    "Event",
    "EventTarget",
    "Text",
    "Comment",
    "DocumentFragment",
    # Client-side routing: anchor inspection, click details, history, and the
    # fetch of the destination document.
    "HtmlAnchorElement",
    "MouseEvent",
    "History",
    "Location",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
]

[dev-dependencies]
# The hydration path mutates real DOM, so it cannot be covered by
# `cargo test --workspace` — that compiles for the host, where there is no
# document. These tests run under `wasm-pack test --headless`, which is the only
# way this crate's actual behaviour gets exercised.
wasm-bindgen-test = "0.3"

[features]
web = []
