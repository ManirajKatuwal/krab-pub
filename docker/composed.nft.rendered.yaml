name: krab
services:
  nft_runner:
    entrypoint:
      - python3
      - scripts/nft_multi_service_gate.py
    environment:
      KRAB_AUTH_BASE_URL: http://service_auth:3001
      KRAB_BEARER_TOKEN: test-token
      KRAB_FRONTEND_BASE_URL: http://service_frontend:3000
      KRAB_USERS_BASE_URL: http://service_users:3002
    image: python:3.12-slim
    networks:
      default: null
    volumes:
      - type: bind
        source: c:\Users\LENOVO\Desktop\krab
        target: /workspace
        bind:
          create_host_path: true
    working_dir: /workspace
  postgres:
    environment:
      POSTGRES_DB: krab
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - postgres
      timeout: 5s
      interval: 10s
      retries: 5
    image: postgres:15-alpine
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
        volume: {}
  redis:
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 5s
      interval: 10s
      retries: 5
    image: redis:7-alpine
    networks:
      default: null
    restart: unless-stopped
  service_auth:
    build:
      context: c:\Users\LENOVO\Desktop\krab
      dockerfile: Dockerfile.service
      args:
        BIN: service_auth
    cap_drop:
      - ALL
    environment:
      KRAB_AUTH_MODE: static
      KRAB_BEARER_TOKEN: test-token
      KRAB_ENVIRONMENT: dev
      KRAB_HOST: 0.0.0.0
      KRAB_PORT: "3001"
      KRAB_RATE_LIMIT_CAPACITY: "100000"
      KRAB_RATE_LIMIT_FAIL_OPEN: "true"
      KRAB_RATE_LIMIT_REFILL_PER_SEC: "100000"
      KRAB_REDIS_URL: redis://redis:6379
      KRAB_TRUST_PROXY_HEADERS: "true"
      RUST_LOG: info
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://localhost:3001/health
      timeout: 5s
      interval: 10s
      retries: 5
    networks:
      default: null
    pids_limit: 256
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
  service_frontend:
    build:
      context: c:\Users\LENOVO\Desktop\krab
      dockerfile: Dockerfile.service
      args:
        BIN: service_frontend
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy
        required: true
      service_auth:
        condition: service_healthy
        required: true
      service_users:
        condition: service_healthy
        required: true
    environment:
      KRAB_AUTH_PUBLIC_PATHS: /about,/greet,/blog/*,/rpc/*,/data/*,/asset-manifest.json,/pkg/*
      KRAB_ENVIRONMENT: dev
      KRAB_HOST: 0.0.0.0
      KRAB_PORT: "3000"
      KRAB_RATE_LIMIT_CAPACITY: "100000"
      KRAB_RATE_LIMIT_FAIL_OPEN: "true"
      KRAB_RATE_LIMIT_REFILL_PER_SEC: "100000"
      KRAB_REDIS_URL: redis://redis:6379
      KRAB_TRUST_PROXY_HEADERS: "true"
      RUST_LOG: info
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://localhost:3000/health
      timeout: 5s
      interval: 10s
      retries: 5
    networks:
      default: null
    pids_limit: 256
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
  service_users:
    build:
      context: c:\Users\LENOVO\Desktop\krab
      dockerfile: Dockerfile.service
      args:
        BIN: service_users
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/krab_users
      DB_MAX_CONNECTIONS: "10"
      DB_MIN_CONNECTIONS: "1"
      KRAB_AUTH_MODE: static
      KRAB_BEARER_TOKEN: test-token
      KRAB_DB_DRIVER: postgres
      KRAB_ENVIRONMENT: dev
      KRAB_HOST: 0.0.0.0
      KRAB_PORT: "3002"
      KRAB_RATE_LIMIT_CAPACITY: "100000"
      KRAB_RATE_LIMIT_FAIL_OPEN: "true"
      KRAB_RATE_LIMIT_REFILL_PER_SEC: "100000"
      KRAB_REDIS_URL: redis://redis:6379
      KRAB_TRUST_PROXY_HEADERS: "true"
      RUST_LOG: info
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://localhost:3002/health
      timeout: 5s
      interval: 10s
      retries: 5
    networks:
      default: null
    pids_limit: 256
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
networks:
  default:
    name: krab_default
volumes:
  postgres_data:
    name: krab_postgres_data
