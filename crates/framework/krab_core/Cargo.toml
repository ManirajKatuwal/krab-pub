[package]
name = "krab_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/krab_core"
description = "Shared runtime for the Krab framework: config, HTTP, database, telemetry, resilience, signals, and protocol governance"
keywords = ["krab", "web", "ssr", "runtime", "framework"]
categories = ["web-programming", "web-programming::http-server", "development-tools"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
redis = { version = "0.27", features = ["tokio-comp"], optional = true }
config = "0.14"
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tower-http = { workspace = true, optional = true, features = ["compression-gzip", "cors", "request-id", "trace", "limit"] }
tower = { workspace = true, optional = true, features = ["util"] }
jsonwebtoken = { version = "9", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

# API Frameworks (Optional)
axum = { workspace = true, optional = true }
async-graphql = { workspace = true, optional = true }

# Database (Optional)
#
# Driver features are NOT listed here — they come from `db-postgres` /
# `db-sqlite` below, so enabling one driver does not compile the other in.
# `postgres` was unconditional, which is why SQLite support could only ever
# live in an application crate.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "macros", "uuid", "time"], optional = true }

[features]
default = []
rest = ["dep:axum", "dep:tower-http", "dep:jsonwebtoken", "dep:tower", "dep:uuid"]
redis-store = ["dep:redis"]

graphql = ["dep:async-graphql"]
grpc = []
web = ["dep:web-sys", "dep:js-sys", "dep:wasm-bindgen"]

# Postgres: connection pooling plus the full migration governance surface —
# checksum validation, drift detection, rollback, promotion policy.
db-postgres = ["dep:sqlx", "sqlx/postgres"]

# SQLite: the driver only. Migration governance is Postgres-specific and does
# not apply; see docs/reference/database.md.
db-sqlite = ["dep:sqlx", "sqlx/sqlite"]

# Deprecated alias for `db-postgres`, kept for one minor version per the
# breaking-change policy in RELEASE_POLICY.md. Remove no earlier than 0.2.0.
db = ["db-postgres"]

[dependencies.web-sys]
version = "0.3"
features = ["Event"]
optional = true

[dependencies.js-sys]
version = "0.3"
optional = true

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
serial_test = "3"
# Dev-only, so the krab_macros <-> krab_core cycle is permitted by Cargo.
# Needed so doc examples that use `#[server]` are compiled rather than skipped.
#
# DO NOT give this a version, and do not switch it to `workspace = true`.
# Cargo strips version-less path dev-dependencies from the published manifest,
# which is the only reason this cycle can be published at all. Adding a version
# here makes `krab_core` require a published `krab_macros` and `krab_macros`
# require a published `krab_core` — a deadlock with no first crate to publish.
krab_macros = { path = "../krab_macros" }
