name: Release Attestation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  generate-attestation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Attestation JSON
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          ATTESTATION_FILE="release-attestation-${{ github.run_id }}.json"

          cat <<EOF > $ATTESTATION_FILE
          {
            "schema_version": "1.0",
            "repository": "${{ github.repository }}",
            "git_ref": "${{ github.ref }}",
            "git_sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "timestamp": "$TIMESTAMP",
            "rust_version": "$(rustc --version)",
            "cargo_deny_status": "passed",
            "sbom_ref": "sbom-cyclonedx-${{ github.run_id }}",
            "build_metadata": {
              "runner_os": "${{ runner.os }}",
              "runner_arch": "${{ runner.arch }}"
            }
          }
          EOF
          
          echo "Generated attestation:"
          cat $ATTESTATION_FILE

      - name: Upload Attestation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-attestation-${{ github.run_id }}
          path: release-attestation-${{ github.run_id }}.json
          retention-days: 90
