[package]
name = "krab_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/krab_core"
description = "Shared runtime for the Krab framework: config, HTTP, database, telemetry, resilience, signals, and protocol governance"
keywords = ["krab", "web", "ssr", "runtime", "framework"]
categories = ["web-programming", "web-programming::http-server", "development-tools"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
redis = { version = "0.27", features = ["tokio-comp"], optional = true }
config = "0.14"
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tower-http = { workspace = true, optional = true, features = ["compression-gzip", "cors", "request-id", "trace", "limit"] }
tower = { workspace = true, optional = true, features = ["util"] }
jsonwebtoken = { version = "9", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

# API Frameworks (Optional)
axum = { workspace = true, optional = true }
async-graphql = { workspace = true, optional = true }

# Database (Optional)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "time"], optional = true }

[features]
default = []
rest = ["dep:axum", "dep:tower-http", "dep:jsonwebtoken", "dep:tower", "dep:uuid"]
redis-store = ["dep:redis"]

graphql = ["dep:async-graphql"]
grpc = []
db = ["dep:sqlx"]
web = ["dep:web-sys", "dep:js-sys", "dep:wasm-bindgen"]

[dependencies.web-sys]
version = "0.3"
features = ["Event"]
optional = true

[dependencies.js-sys]
version = "0.3"
optional = true

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
serial_test = "3"
