name: DX and Operations Hardening

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'crates/framework/krab_core/**'
      - 'crates/framework/krab_macros/**'
      - 'crates/tooling/krab_cli/**'
      - 'crates/framework/krab_server/**'
      - 'crates/tooling/krab_orchestrator/**'
      - 'services/service_auth/**'
      - 'services/service_users/**'
      - 'services/service_frontend/**'
      - 'crates/framework/krab_client/**'
      - 'Dockerfile.service'
      - 'docker-compose.yml'
      - 'krab.toml'
      - '.env.example'
      - '.github/workflows/ops-hardening.yaml'
      - '.github/workflows/db-lifecycle.yaml'
      - '.github/workflows/api-contract.yaml'
      - '.github/workflows/e2e-depth.yaml'
  push:
    branches:
      - main

jobs:
  lint-format-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Clippy strict check
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Runs the whole suite, including doc examples. Without this, krab_core's
      # auth/db/api/server_fn tests and every rustdoc example are only ever
      # exercised locally.
      - name: Workspace tests (default features)
        run: cargo test --workspace

      # Deliberately NOT `--workspace --all-features`: that would enable
      # service_frontend's `nft` feature, whose latency assertions (6ms p95)
      # are only meaningful on the dedicated runners in nft.yaml. krab_core has
      # no such feature, and this is the only way its `grpc` and `web` code
      # paths get compiled at all — no workspace member enables them.
      - name: krab_core tests (all features)
        run: cargo test -p krab_core --all-features

      - name: Rustdoc build check
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Dependency policy gate (CI/local parity)
        run: cargo run --package krab_cli -- security dependency-gate --diagnostics

      - name: Verify alert routing + on-call delivery path
        run: python3 scripts/verify_oncall_delivery_path.py

  migration-contract-e2e-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required workflow files exist
        run: |
          test -f .github/workflows/db-lifecycle.yaml
          test -f .github/workflows/api-contract.yaml
          test -f .github/workflows/e2e-depth.yaml

  artifact-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build provenance manifest
        run: |
          sha256sum Cargo.lock > provenance.sha256
          sha256sum .env.example >> provenance.sha256
          sha256sum krab.toml >> provenance.sha256

      - name: Upload provenance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: krab-provenance
          path: |
            provenance.sha256
            Cargo.lock
            .env.example
            krab.toml

  release-certification-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Generate release certification evidence
        run: cargo run --package krab_cli -- release certify --out internal/audit/release-certify/run-${{ github.run_id }} --json

      - name: Upload release certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-certification-${{ github.run_id }}
          path: |
            internal/audit/release-certify/run-${{ github.run_id }}
            internal/audit/release-certify/latest.json
            internal/audit/release-certify/latest.md
