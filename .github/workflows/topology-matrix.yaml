name: topology-matrix

# What makes the two legs differ is the ambient env below, not the test command.
# `services/service_frontend/src/topology_matrix_tests.rs` resolves
# `KRAB_RUNTIME_TOPOLOGY` / `KRAB_RUNTIME_ENDPOINTS_JSON` the way `main` does and
# asserts a different consequence per mode, so `monolith` and `distributed` take
# different assertion paths. Keep both legs and keep the env at job scope: with
# it dropped, the suite falls back to its documented monolith default and the
# distributed leg silently stops testing anything.

on:
  pull_request:
    paths:
      - "services/service_frontend/**"
      - "crates/framework/krab_core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/topology-matrix.yaml"
  push:
    branches: [main]

jobs:
  frontend-topology-matrix:
    name: frontend tests (${{ matrix.topology }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topology: [monolith, distributed]

    env:
      KRAB_RUNTIME_TOPOLOGY: ${{ matrix.topology }}
      KRAB_RUNTIME_ENDPOINTS_JSON: >-
        {"auth":{"base_url":"http://127.0.0.1:3001","timeout_ms":1200,"max_retries":1},"users":{"base_url":"http://127.0.0.1:3002","timeout_ms":1200,"max_retries":1}}
      RUST_TEST_THREADS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Topology diagnostics
        run: |
          echo "KRAB_RUNTIME_TOPOLOGY=${KRAB_RUNTIME_TOPOLOGY}"
          echo "KRAB_RUNTIME_ENDPOINTS_JSON=${KRAB_RUNTIME_ENDPOINTS_JSON}"
          # A leg whose env did not reach the runner would run as the monolith
          # default and pass without testing its own topology. Refuse that.
          test -n "${KRAB_RUNTIME_TOPOLOGY}" || {
            echo "::error::KRAB_RUNTIME_TOPOLOGY is empty; this leg would test nothing"
            exit 1
          }
          test -n "${KRAB_RUNTIME_ENDPOINTS_JSON}" || {
            echo "::error::KRAB_RUNTIME_ENDPOINTS_JSON is empty; this leg would test nothing"
            exit 1
          }

      - name: Run frontend tests in topology mode
        run: cargo test -p service_frontend

