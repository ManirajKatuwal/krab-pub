[package]
name = "krab_orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/krab_orchestrator"
description = "Multi-process service runner for Krab workspaces, driven by krab.toml"
keywords = ["krab", "orchestrator", "supervisor", "microservices"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

[dependencies]
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
toml = "0.8"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
krab_core = { workspace = true }
notify = "6"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }

# The kill-on-close Job Object that keeps services from outliving a crashed
# orchestrator (see src/job_object.rs). 0.61 is the windows-sys already in the
# lock file via tokio/mio, so this adds no new crate — only the Win32 feature
# modules the job APIs live in. `Win32_Security` is required by the
# `CreateJobObjectW` binding's signature; `Win32_System_Threading` by the
# extended-limit struct.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

# The job-object test walks the process table to find the grandchild.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_ToolHelp"] }
