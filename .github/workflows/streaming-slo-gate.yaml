name: streaming-slo-gate

on:
  pull_request:
    paths:
      - "services/service_frontend/**"
      - "crates/framework/krab_core/**"
      - "internal/reports/STRATEGIC_PLAN.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/streaming-slo-gate.yaml"
  push:
    branches: [main]

jobs:
  stream-slo-regression:
    runs-on: ubuntu-latest
    env:
      RUST_TEST_THREADS: "1"
      KRAB_SSR_STREAM_SLO_P95_MS: "200"
      KRAB_SSR_STREAM_SLO_P99_MS: "400"
      KRAB_SSR_STREAM_FAST_P95_MS: "200"
      KRAB_SSR_STREAM_SLOW_P95_MS: "400"
      KRAB_SSR_MIXED_PROFILE_SAMPLES: "1200"
      KRAB_SSR_MIXED_PROFILE_SLOW_EVERY: "5"
      KRAB_SSR_MIXED_PROFILE_SLOW_PENALTY_MS: "5"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: ISR cache finalization invariants
        run: cargo test -p service_frontend isr_snapshot_finalization -- --nocapture

      - name: ISR stale->fresh regeneration contract
        run: cargo test -p service_frontend isr_cache_serves_fresh_then_stale -- --nocapture

      - name: Streaming SSR mixed fast/slow client SLO profile
        run: cargo test -p service_frontend --features nft non_functional_mixed_fast_slow_client_streaming_profile -- --nocapture

