[package]
name = "krab_client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/krab_client"
description = "WASM island hydration runtime for the Krab framework"
keywords = ["krab", "wasm", "hydration", "islands", "frontend"]
categories = ["wasm", "web-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# The router awaits a `fetch` promise from a synchronous click handler.
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
krab_core = { workspace = true, features = ["web"] }
krab_macros = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
inventory = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "NodeList",
    "Window",
    "console",
    "Event",
    "EventTarget",
    "Text",
    "Comment",
    "DocumentFragment",
    # Client-side routing: anchor inspection, click details, history, and the
    # fetch of the destination document.
    "HtmlAnchorElement",
    # Used by the reconciliation browser tests to prove that a focused input
    # with typed text survives an insertion above it.
    "HtmlInputElement",
    "MouseEvent",
    "History",
    "Location",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
]

[dev-dependencies]
# The hydration path mutates real DOM, so it cannot be covered by
# `cargo test --workspace` — that compiles for the host, where there is no
# document. These tests run under `wasm-pack test --headless`, which is the only
# way this crate's actual behaviour gets exercised.
wasm-bindgen-test = "0.3"
# Observes attribute writes in the reactive-attribute browser suite. Test-only,
# so these features stay out of the runtime's own web-sys feature list.
web-sys = { version = "0.3", features = ["MutationObserver", "MutationObserverInit", "MutationRecord"] }

[features]
# `web` is ON by default. It gates the entire hydration runtime — `hydrate()`,
# the reconciler, the client router's browser half — so a build without it
# produces a bundle whose `hydrate()` logs one line and returns.
#
# It was previously opt-in with no default, and three documented build paths
# (the wasm size gate, CLAUDE.md, `krab build --release`) omitted it. Every one
# of them shipped a ~15 KB no-op instead of the ~198 KB runtime, and
# `service_frontend` ran its JS fallback because the module it loaded did
# nothing. Defaulting it on means the obvious command produces the working
# artifact; a consumer that genuinely wants the inert native half of `#[island]`
# — a server-side renderer — opts out with `default-features = false`.
default = ["web"]

web = []

# Verbose console tracing of the hydration walk. Off by default: the messages
# are per-node and only useful when debugging a mismatch.
debug = []

# `demo-islands` (the bundled `Counter` / `Toggle` / `Likes`) was deprecated in
# 0.4.0 and removed in 0.6.0: every `#[island]` registers under its plain name,
# so shipping islands from the framework claimed those names in every
# consumer's registry. Define islands in your own crate.

# rustc 1.97 emits bulk-memory and nontrapping-fptoint by default; the binaryen
# wasm-pack bundles (version 117) rejects them unless told they exist. Without
# this, `wasm-pack build` dies at the wasm-opt step — locally and in CI.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
