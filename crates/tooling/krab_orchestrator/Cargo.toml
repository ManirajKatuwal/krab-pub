[package]
name = "krab_orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/krab_orchestrator"
description = "Multi-process service runner for Krab workspaces, driven by krab.toml"
keywords = ["krab", "orchestrator", "supervisor", "microservices"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

[dependencies]
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
toml = "0.8"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
krab_core = { workspace = true }
notify = "6"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }
